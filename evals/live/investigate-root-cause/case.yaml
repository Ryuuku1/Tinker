schema_version: "1.1"
name: investigate-root-cause
description: A defect is traced to the shared expiry rule, fixed there with a regression test, explained by its causal mechanism, reported without claiming unrun tests passed, and done without a subagent.
tags: [investigate, retro, regression]
context:
  scaffold_script: setup.sh
execution:
  append_system_prompt: TINKER_AGENTS_MD
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill, Agent]
  prompt: |
    In product/members: a membership card that expires today still opens the gate. The rule is that a card is expired on its expiry date. Find out why and fix it.

    (This run is unattended: no commits, pushes or pull requests. Shell commands are unavailable in this run: use Read, Grep, Glob, Edit and Write.)
graders:
  - name: fixed-at-root
    type: regex
    target: { source: file, path: product/members/members/expiry.py }
    pattern: 'expires_on\s*<=\s*today|today\s*>=\s*expires_on'
    weight: 2
  - name: gate-not-patched
    type: regex
    target: { source: file, path: product/members/members/gate.py }
    pattern: 'expires_on"\]\s*[<>]|[<>]=?\s*today|today\s*[<>]'
    match: not_contains
  - name: regression-test
    type: llm
    focus: { source: file, path: product/members/tests/test_expiry.py }
    criteria: The test file keeps the existing test and adds one asserting that a card whose expiry date equals `today` counts as expired.
  - name: causal-and-honest
    type: llm
    criteria: The final message explains the mechanism (is_expired in members/expiry.py compares with a strict `<`, so on the expiry date itself the card is not yet expired, and gate.py relies on it), describes the fix and the added test, and says the tests were not run in this session instead of claiming they passed.
    weight: 2
  - name: no-subagent-for-simple-task
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: retro-saved
    type: file_exists
    path: .tinker/retros/*-investigate.md
