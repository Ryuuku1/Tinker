schema_version: "1.1"
name: shape-grill-me
description: In grill-me mode, shape looks up what the code already answers (notes live in a JSON file), then asks one decision at a time with a recommended answer, and edits nothing before the user confirms.
tags: [shape, grill-me, regression]
context:
  scaffold_script: setup.sh
execution:
  append_system_prompt: TINKER_AGENTS_MD
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill, Agent]
  prompt: |
    Grill me about adding tags to notes in product/notes before we build anything.
graders:
  - name: looks-up-the-code
    type: tool_used
    tool: Read
    input_match: 'product[\\/]+notes[\\/]'
  - name: no-product-writes
    type: tool_used
    tool: Write
    input_match: 'product[\\/]'
    min: 0
    max: 0
  - name: no-product-edits
    type: tool_used
    tool: Edit
    input_match: 'product[\\/]'
    min: 0
    max: 0
  # The reply says what the code settles (notes live in ~/.notes.json) instead of asking it.
  # ponytail: a reply that names the file and still asks where notes are stored passes; a judge clause if one appears.
  - name: states-what-the-code-settles
    type: regex
    pattern: 'notes\.json'
  - name: recommends-an-answer
    type: regex
    pattern: 'recommend'
    flags: i
  # One fact only. The old judge also weighed storage, the recommendation and change claims, and failed replies that
  # met every clause when they previewed later questions or closed by asking the same question again.
  - name: one-decision-now
    type: llm
    criteria: 'The final message asks the user to settle one decision now. Count decisions, not question marks: a heading question and a closing line that asks the same thing again in other words are one decision, and its options, an "or something else?" and a preview of topics for later turns are all part of it. It fails only when it also asks the user to settle a different decision now, for example "Which one? If A, do you also accept this tag syntax?".'
    weight: 2
