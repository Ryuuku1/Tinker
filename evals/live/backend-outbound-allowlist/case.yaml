schema_version: "1.1"
name: backend-outbound-allowlist
description: A new fetch of a user-supplied URL goes through the product's existing host allowlist and HTTPS only, a test proves another host is refused, and the final message names the new trust boundary.
tags: [implement, security, retro, regression]
context:
  scaffold_script: setup.sh
execution:
  append_system_prompt: TINKER_AGENTS_MD
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill, Agent]
  prompt: |
    In product/profiles: users can now paste an image URL in their profile form instead of uploading a file. Add fetch_avatar(url) to profiles/avatars.py: download the image at that URL with the standard library and return its bytes, size-checked the way uploads are. Add tests.

    (This run is unattended: no commits, pushes or pull requests. Shell commands are unavailable in this run: use Read, Grep, Glob, Edit and Write.)
graders:
  - name: reuses-host-allowlist
    type: regex
    target: { source: file, path: product/profiles/profiles/avatars.py }
    pattern: 'AVATAR_HOSTS'
    weight: 2
  - name: https-only
    type: regex
    target: { source: file, path: product/profiles/profiles/avatars.py }
    pattern: '["'']https["'']'
  - name: test-refuses-other-host
    type: regex
    target: { source: file, path: product/profiles/tests/test_avatars.py }
    pattern: '["''](?:https?|ftp|file)://(?!images\.example\.com[/:"'']|cdn\.example\.com[/:"''])'
    weight: 2
  - name: names-trust-boundary
    type: llm
    criteria: The final message tells the user that fetch_avatar now downloads a URL the user supplies (an outbound request across a trust boundary) and says how it is restricted, for example to the allowed hosts and HTTPS.
  - name: retro-saved
    type: file_exists
    path: .tinker/retros/*-implement.md
