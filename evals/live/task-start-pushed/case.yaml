schema_version: "1.1"
name: task-start-pushed
description: Continuing a branch that is already pushed, the task start fetches the base but does not rebase; it reports how far the branch is behind origin/develop instead.
tags: [task-start, playbook, heldout]
context:
  scaffold_script: setup.sh
execution:
  append_system_prompt: TINKER_AGENTS_MD
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    In product/shop: continue the work on branch fix/rounding. It was cut from origin/develop, its three commits are already pushed to origin/fix/rounding for review, and its tracked files are clean. Before any code work, list in order the exact git commands your task start runs for this branch and what you do with their output. Just tell me; don't run anything.
graders:
  - name: fetch-base
    type: regex
    pattern: 'git[^\n]*fetch[^\n]*origin[^\n]*develop'
  - name: behind-count
    type: regex
    pattern: 'rev-list[^\n]*--count[^\n]*origin/develop|rev-list[^\n]*--left-right[^\n]*origin/develop'
  # Fails a sentence that runs a rebase, merge, hard reset or force push, unless the same sentence declines it
  # ("I skip `git rebase origin/develop`") or states its guard ("The rebase (`git rebase origin/develop`) only runs
  # if both conditions pass", "... unless a commit is pushed"). Replaces an llm judge that failed answers meeting
  # every clause.
  # ponytail: any negation or guard word in the sentence spares it, so a plan that only states the guard and never
  # decides passes; a full parse of the plan if that ever lets a rewrite through.
  # A fast-forward onto the branch's own head (`merge --ff-only origin/fix/rounding`) is spared, since the task start
  # catches up with commits pushed to its pull request; any other merge still fails, and the `only` in `--ff-only`
  # is not a guard word.
  # A `.`, `!` or `?` followed by a non-space (`workspace.md:28`, `!=`) does not end a sentence, so a guard
  # after a citation still counts: "`git rebase origin/develop` ([policies/workspace.md:28](...)): Not run".
  - name: leaves-pushed-branch-alone
    type: regex
    pattern: '(?:^|[.!?]\s)(?!(?:[^.!?\n]|[.!?](?=\S))*\b(?:skip\w*|never|not|no|(?:don|won|doesn|didn|can|shouldn|mustn)[\x27’]t|cannot|without|instead|rather than|forbid\w*|rules? out|ruled out|off the table|unless|(?<!-)only\b(?:[^.!?\n]|[.!?](?=\S))*\b(?:if|when))\b)(?:[^.!?\n]|[.!?](?=\S))*?\bgit\s+(?:-C\s+\S+\s+)?(?:rebase\b|pull\b(?:[^.!?\n]|[.!?](?=\S))*--rebase|push\b(?:[^.!?\n]|[.!?](?=\S))*(?:--force|\s-f\b|\s\+)|reset\s+--hard|merge(?![-\w])(?!\s+--ff-only\s+origin/fix/rounding(?![-\w/])))'
    flags: im
    match: not_contains
    weight: 2
