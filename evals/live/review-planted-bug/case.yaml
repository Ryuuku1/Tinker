schema_version: "1.1"
name: review-planted-bug
description: A small review finds the planted off-by-one with a file:line finding, stays read-only in the product repository, spawns no subagent, and saves its retro under the Tinker root.
tags: [review, retro, regression]
context:
  scaffold_script: setup.sh
execution:
  append_system_prompt: TINKER_AGENTS_MD
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, Agent]
  prompt: |
    Review product/ledger/ledger/totals.py in product/ledger: it is the whole change on this branch.

    (This run is unattended: no commits, pushes or pull requests. Shell commands are unavailable in this run.)
graders:
  # Regexes replace an llm judge that failed 1 of 19 stored runs, a right answer citing totals.py:7, the
  # range(1, ...) loop and a sum() fix; all 17 distinct stored answers match all three. The judge's ban on
  # style nitpicks presented as defects is dropped, since no regex can grade it.
  - name: finds-off-by-one
    type: regex
    pattern: 'range\(\s*1\s*,|\bindex 1\b|\bskip(?:s|ped|ping)?\b[^.\n]{0,30}\b(?:first|opening|0)\b|entries\[0\][^.\n]{0,40}\b(?:never|not|skipp|drop|miss|left out|ignored)'
    flags: i
    weight: 2
  - name: cites-line
    type: regex
    pattern: 'totals\.py(?::|,? line |#L)\s*[6-9]\b'
  - name: proposes-every-entry
    type: regex
    pattern: '\bsum\(|range\(\s*(?:0\s*,\s*)?len\(\s*entries\s*\)\s*\)|for \w+ in entries\b|\b(?:start|begin)s? (?:the loop )?(?:at|from) (?:index )?0\b|range\(\s*0\s*,'
    flags: i
  - name: no-product-writes
    type: tool_used
    tool: Write
    input_match: 'product[\\/]'
    min: 0
    max: 0
  - name: no-product-edits
    type: tool_used
    tool: Edit
    input_match: 'product[\\/]'
    min: 0
    max: 0
  - name: no-subagent-for-small-review
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: retro-saved
    type: file_exists
    path: .tinker/retros/*-review.md
